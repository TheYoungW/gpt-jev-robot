[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-jev-robot"
version = "0.1.0"
description = "Agent-directed Yunyi tabletop manipulation with Jev decisions and MuJoCo"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.3,<4", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio>=2.34", "imageio-ffmpeg>=0.5", "httpx>=0.27", "mcp>=1.12,<2", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-robot = "gpt_jev_robot.cli:main"
jev-robot-mcp = "gpt_jev_robot.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
